# Include inside the EXISTING frontend server block. Preserve its /api and /static routes.
# Same-host nginx example. Container deployments should use their service DNS instead.
location /mcp-extension/ {
    proxy_pass http://127.0.0.1:5680/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 1m;
}
